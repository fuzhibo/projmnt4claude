# Bun Test Configuration
#
# 覆盖率配置说明 (2026-05-21):
# ============================================
# 【背景】
# 之前 coverage = true + coverageThreshold = 0.8 的全局配置导致所有 `bun test`
# 都背负覆盖率阈值检查。当覆盖率不足时，即使测试全部通过，退出码也为 1。
#
# 【问题】
# 这违背了 dev-qa 协作的递进式理念：
# - Dev 阶段：只需验证测试通过，不应被覆盖率阈值阻碍
# - QA 阶段：只需验证测试通过，覆盖率检查应独立触发
# - QA 门禁：覆盖率检查是 QA 门禁的职责，通过 PostQAGateRunner 独立运行
#
# 【解决方案】
# - 移除全局覆盖率阈值，让 `bun test` 只关注测试通过/失败
# - QA 门禁的覆盖率检查通过 `bun test --coverage` 独立运行
# - CI 发布前的覆盖率检查在 CI 流程中显式配置
#
# 【相关文档】
# - .projmnt4claude/reports/coverage-low-investigation-report.md
# - docs/investigation/checkpoint-design-problems/problem-02-qa-gate-detail.md
# - docs/investigation/checkpoint-design-problems/problem-05-retry-mechanism.md
#
# 【相关任务】
# - TASK-feature-P1-qa-20260520: QA 门禁覆盖率检查集成
# - TASK-feature-P2-feat-gxnd7r-20260520: 重试机制优化
# ============================================

[test]
# Coverage configuration
# 默认不开启覆盖率检查，让 `bun test` 只关注测试通过/失败
# 覆盖率检查由 QA 门禁独立触发（运行 `bun test --coverage`）
coverage = false

# Coverage reporters (当显式运行 --coverage 时使用)
coverageReporter = ["text", "lcov"]

# Test timeout (30 seconds)
testTimeout = 30000

# Bail on first failure in CI
bail = true

# ─── OOM 防护配置 (2026-06-05) ───
# 限制并发以降低内存峰值，配合进程级隔离使用
# 这些参数仅对直接 `bun test` 调用生效
# 推荐: 使用 `npm test` 或 `bun run test` (调用批处理运行器)
# 如果必须直接调用 `bun test`，请添加: bun --smol test --max-concurrency=5
[test.run]
# 降低并发数 (默认 20 过高会导致内存峰值)
maxConcurrency = 5
